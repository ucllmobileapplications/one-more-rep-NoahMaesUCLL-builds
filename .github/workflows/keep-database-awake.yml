# Free Supabase projects are paused after a week without activity. This reads One More Rep's world leaderboard every six
# hours so its database stays up. It only calls the public, read-only top_lifters function with the publishable key
# (the same public key the game itself uses) and needs no repository permissions. If the project were ever paused, the
# run fails (curl --fail), and GitHub's failure email is the early warning.
name: Keep the database awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the world leaderboard
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 30 \
            "https://rmfcopbmyphpfkykgztk.supabase.co/rest/v1/rpc/top_lifters?p_limit=3" \
            -H "apikey: sb_publishable_lSqaRwLZQnIbusElcOe9kw_qqAXxiHj"
